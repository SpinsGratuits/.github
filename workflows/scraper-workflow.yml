name: Script de Scraping Périodique

on:
  schedule:
    # S'exécute tous les jours à minuit UTC (Modifiable via la syntaxe cron)
    - cron: '58 16 * * *'
  workflow_dispatch: # Permet de lancer le script manuellement depuis GitHub si besoin

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupérer le code du repository
    - name: Checkout du code
      uses: actions/checkout@v4

    # 2. Installer Python
    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Installer les dépendances nécessaires
    - name: Installer les librairies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    # 4. Exécuter le script de scraping
    - name: Lancer le scraper
      run: python scraper.py

    # 5. Sauvegarder automatiquement le fichier CSV modifié dans le cloud (GitHub)
    - name: Sauvegarder les modifications dans le dépôt
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.csv
        git commit -m "Mise à jour automatique des données : $(date +'%Y-%m-%d')" || exit 0
        git push
